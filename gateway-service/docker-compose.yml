version: '3.9'

services:
  gateway-service:
    container_name: metric-gateway
    image: metric/gateway-service:prod
    build:
        context: .
        dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    healthcheck:
      test: ['CMD', "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
        - .env.production
    volumes:
      - ./keys:/app/keys:ro
    networks:
        - metric-network

networks:
  metric-network:
    external: true
