global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'gateway-service'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'gateway-service:4000'

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'auth-service:9101'

  - job_name: 'postgres'
    static_configs:
      - targets:
        - 'postgres-exporter:9187'

  - job_name: 'rabbitmq'
    static_configs:
      - targets:
        - 'rabbitmq-exporter:9419'

  - job_name: 'node'
    static_configs:
      - targets:
        - 'node-exporter:9100'

  - job_name: 'prometheus'
    static_configs:
      - targets:
        - "prometheus:9090"
